[project]
name = "barcode-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vu Truong Anh", email = "vu.wspace@gmail.com" }
]
requires-python = ">=3.13.16"
dependencies = [
    "fastapi>=0.120.0",
    "langchain>=1.4.7",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openrouter>=0.2.9",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.16",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "pyvi>=0.1.1",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.2.0",
    "tavily-python>=0.8.5",
    "torch>=2.14.1",
    "truststore>=0.10.5",
    "uvicorn[standard]>=0.38.0",
]

[project.scripts]
barcode-chatbot = "barcode_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
