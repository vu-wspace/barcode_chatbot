[project]
name = "packing-agent"
version = "0.1.0"
description = "AI agent for the packing station: looks up products and verifies orders through the BE API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120.0",
    "httpx>=0.28",
    "langchain>=1.4.7",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.8",
    "python-dotenv>=1.2.4",
    "truststore>=0.10.5",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
