<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiểm tra đóng gói</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1b1f24; --muted:#667; --line:#dde1e6; --accent:#367018; --accent-fg:#367018; --err:#b42d2d; --err-fg:#b42d2d; --warn-fg:#946600; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171b; --card:#1d2126; --fg:#e8ebee; --muted:#9aa3ad; --line:#2e343b; --accent-fg:#8fd16a; --err-fg:#ff7b7b; --warn-fg:#e0a800; } }
  [hidden] { display:none !important; } /* display:flex rules below would otherwise override the hidden attribute */
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:1280px; margin:0 auto; padding:16px; }
  /* 2x2: Camera scanner | AI Chat / Đơn | History. One column on narrow screens, in that order. */
  .grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px; align-items:stretch; }
  /* phone: the order verdict right under the scanner, chat and history after it */
  @media (max-width: 900px) { .grid { grid-template-columns:minmax(0, 1fr); } #pOrder { order:1; } #pChat { order:2; } #pHist { order:3; } }
  .panel { margin:0; display:flex; flex-direction:column; min-width:0; }
  .panel h2 { font-size:1.05rem; margin:0 0 12px; }
  /* chat log and history fill their cell and scroll; contain:size keeps them from stretching the row */
  .panel .chat, .panel .scroll { flex:1 1 0; min-height:260px; overflow-y:auto; contain:size; }
  /* scroll areas still scroll (wheel, touch, keys); only the bar is hidden */
  * { scrollbar-width:none; } *::-webkit-scrollbar { display:none; }
  .result { margin-top:16px; padding-top:16px; border-top:1px solid var(--line); }
  h1 { font-size:1.4rem; margin:.2em 0 .6em; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  button, .btn { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; padding:8px 14px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
  button.primary, .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tabs button[aria-selected="true"] { border-color:var(--accent-fg); color:var(--accent-fg); font-weight:600; }
  button:disabled { opacity:.6; cursor:wait; }
  :focus-visible { outline:2px solid var(--accent-fg); outline-offset:2px; }
  .stage { position:relative; background:#000; border-radius:10px; overflow:hidden; aspect-ratio:16/9; display:grid; place-items:center; }
  .stage video, .stage canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; }
  .stage video[hidden] { display:none; }
  .controls { position:absolute; top:8px; right:8px; display:flex; flex-direction:column; gap:6px; z-index:2; }
  .controls button { background:rgba(0,0,0,.55); color:#fff; border:0; width:40px; height:40px; justify-content:center; padding:0; }
  .controls button.on { background:var(--accent); }
  #zoom { position:absolute; left:12px; bottom:12px; width:40%; z-index:2; }
  .guide { position:absolute; inset:22% 12%; border:2px dashed rgba(255,255,255,.5); border-radius:8px; z-index:1; pointer-events:none; }
  .stage.locked .guide { border:3px solid var(--accent); }
  #feedback { min-height:1.5em; margin:8px 0 0; color:var(--muted); }
  #feedback.warn { color:var(--warn-fg); } #feedback.ok { color:var(--accent-fg); }
  .drop { border:2px dashed var(--line); border-radius:10px; padding:28px; text-align:center; cursor:pointer; }
  .drop.over { border-color:var(--accent); }
  .drop img { max-width:100%; max-height:280px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  /* flex-basis: on a phone the buttons wrap to the next line instead of squeezing the field to a few characters */
  input[type=text] { font:inherit; flex:1 1 12rem; min-width:0; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  .result .val { font:600 1.3rem/1.3 ui-monospace, monospace; word-break:break-all; }
  .tag { display:inline-block; font-size:.8rem; padding:2px 8px; border-radius:99px; background:var(--accent); color:#fff; }
  .muted { color:var(--muted); font-size:.85rem; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:10px 0 0; } dt { color:var(--muted); } dd { margin:0; word-break:break-all; }
  ul.hist { list-style:none; padding:0; margin:8px 0 0; }
  ul.hist li { display:flex; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  ul.hist li button.v { background:none; border:0; padding:4px 0; color:inherit; text-align:left; display:block; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:ui-monospace, monospace; cursor:pointer; }
  ul.hist li button:not(.v) { padding:4px 8px; min-width:40px; min-height:40px; justify-content:center; } /* finger-sized */
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#222; color:#fff; padding:10px 16px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:calc(100% - 32px); }
  #toast.show { opacity:1; } #toast.err { background:var(--err); }
  .prod { margin-top:10px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; }
  .prod.none { color:var(--err-fg); }
  ul.items { list-style:none; padding:0; margin:10px 0 0; }
  ul.items li { display:flex; gap:8px; padding:6px 0; border-top:1px solid var(--line); }
  ul.items li .n { margin-left:auto; font-family:ui-monospace, monospace; }
  ul.items li.done .n { color:var(--accent-fg); font-weight:600; }
  ul.items li.over .n { color:var(--err-fg); font-weight:600; }
  .verdict { margin-top:10px; padding:10px 12px; border-radius:8px; font-weight:600; white-space:pre-line; }
  .verdict.ok { background:var(--accent); color:#fff; } .verdict.ng { background:var(--err); color:#fff; }
  .verdict.wait { border:1px solid var(--line); color:var(--muted); font-weight:400; }
  .chat { display:flex; flex-direction:column; margin-top:0; }
  .msg { padding:8px 12px; border-radius:10px; margin:4px 0; white-space:pre-wrap; max-width:90%; word-break:break-word; }
  .msg.me { background:var(--accent); color:#fff; align-self:flex-end; }
  .msg.ai { background:var(--bg); border:1px solid var(--line); align-self:flex-start; }
  .msg.err { border-color:var(--err-fg); color:var(--err-fg); }
  .msg button { margin-top:6px; padding:4px 10px; }
  .msg.checklist { background:var(--bg); border:1px solid var(--line); align-self:flex-start; width:90%; white-space:normal; }
  /* printed checklist: only the order panel, black on white, a tick box per line to mark by hand */
  @media print {
    :root { --fg:#000; --muted:#333; --bg:#fff; --card:#fff; --line:#999; --accent-fg:#000; --err-fg:#000; }
    body { background:#fff; color:#000; }
    main > h1, .grid > section:not(#pOrder), #orderForm, #toast { display:none !important; }
    .grid { display:block; } #pOrder { border:0; padding:0; }
    ul.items li::before { content:"\2610\00a0"; } ul.items li.done::before { content:"\2611\00a0"; }
    .verdict { border:1px solid #000; background:none !important; color:#000 !important; }
  }
</style>
</head>
<body>
<main>
  <h1>Kiểm tra đóng gói</h1>
  <div class="grid">
  <section class="card panel" id="pScan" aria-labelledby="pScanH">
    <h2 id="pScanH">📷 Camera scanner</h2>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabCam" aria-selected="true" aria-controls="camMode" tabindex="0">📷 Camera</button>
      <button role="tab" id="tabUp" aria-selected="false" aria-controls="upMode" tabindex="-1">📁 Upload image</button>
    </div>

    <div id="camMode" role="tabpanel" aria-labelledby="tabCam">
      <div class="stage" id="stage">
        <video id="video" playsinline muted hidden></video>
        <canvas id="overlay"></canvas>
        <div class="guide" hidden id="guide"></div>
        <button class="primary" id="startBtn" style="z-index:2">▶ Start camera</button>
        <div class="controls" id="controls" hidden>
          <button id="stopBtn" title="Stop camera" aria-label="Stop camera">✕</button>
          <button id="flipBtn" title="Flip camera" aria-label="Flip camera">🔄</button>
          <button id="torchBtn" title="Toggle light" aria-label="Toggle light" aria-pressed="false" hidden>🔦</button>
          <button id="beepBtn" title="Sound on scan" aria-label="Sound on scan" aria-pressed="true" class="on">🔊</button>
        </div>
        <input type="range" id="zoom" min="1" max="5" step="0.1" value="1" aria-label="Zoom" hidden>
      </div>
      <p id="feedback" aria-live="polite"></p>
    </div>

    <div id="upMode" role="tabpanel" aria-labelledby="tabUp" hidden>
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose or drop an image">
        <div id="dropText">Drop an image here or click to choose</div>
        <img id="preview" alt="" hidden>
      </div>
      <input type="file" id="file" accept="image/*" hidden>
    </div>

    <div class="row">
      <input type="text" id="manual" placeholder="Or type a barcode number (6–14 digits)" inputmode="numeric" aria-label="Barcode number">
      <button id="manualBtn">Look up</button>
    </div>
    <div class="result" id="result" hidden></div>
  </section>
  <section class="card panel" id="pChat" aria-labelledby="pChatH">
    <h2 id="pChatH">💬 AI Chat</h2>
    <div class="chat" id="chat" aria-live="polite"></div>
    <form class="row" id="chatForm">
      <input type="text" id="chatInput" placeholder="Hỏi về sản phẩm, đơn hàng…" aria-label="Tin nhắn cho trợ lý" maxlength="1000">
      <button class="primary">Gửi</button>
    </form>
  </section>
  <section class="card panel" id="pOrder" aria-labelledby="pOrderH">
    <h2 id="pOrderH">📦 Đơn</h2>
    <form class="row" id="orderForm">
      <input type="text" id="orderId" placeholder="Nhập hoặc quét mã đơn, vd SO-104587" aria-label="Mã đơn hàng">
      <button class="primary" id="orderLoad">Tải đơn</button>
      <button type="button" id="orderReset" hidden>Quét lại từ đầu</button>
      <button type="button" id="orderPrint" hidden>In checklist</button>
    </form>
    <div id="order" hidden></div>
  </section>
  <section class="card panel" id="pHist" aria-labelledby="pHistH">
    <h2 id="pHistH">🕘 History</h2>
    <div class="row" style="margin:0;justify-content:space-between">
      <span class="muted">Mã đã quét gần đây</span>
      <span class="row" style="margin:0">
        <button id="csvBtn">Export CSV</button>
        <button id="copyAllBtn">Copy all</button>
        <button id="clearBtn">Clear</button>
      </span>
    </div>
    <div class="scroll"><ul class="hist" id="hist"></ul></div>
    <p class="muted" id="histEmpty">No scans yet.</p>
  </section>
  </div>
</main>
<div id="toast" role="status"></div>

<script src="core.js"></script>
<script>
(function () {
  'use strict';
  var CFG = {
    polyfill: 'https://cdn.jsdelivr.net/npm/barcode-detector@3.2.3/dist/iife/polyfill.min.js',
    formats: ['qr_code','aztec','codabar','code_39','code_93','code_128','data_matrix','ean_8','ean_13','itf','pdf417','upc_a','upc_e'],
    detectIntervalMs: 80, detectTimeoutMs: 3000, rearmGoneMs: 700, requiredAgreement: 3, agreeWindowMs: 1500, pauseMs: 1200,
    maxHistory: 100, historyKey: 'scanner_history_v1', settingsKey: 'scanner_settings_v1',
  };
  var NAMES = { qr_code:'QR Code', aztec:'Aztec', codabar:'Codabar', code_39:'Code 39', code_93:'Code 93', code_128:'Code 128', data_matrix:'Data Matrix', ean_8:'EAN-8', ean_13:'EAN-13', itf:'ITF', pdf417:'PDF417', upc_a:'UPC-A', upc_e:'UPC-E', asin:'ASIN', unknown:'Unknown' };
  var $ = function (id) { return document.getElementById(id); };
  var S = { facing: 'environment', stream: null, track: null, scanning: false, paused: false, detector: null, lastDetect: 0, history: [], beep: true, audio: null, torch: false, pauseTimer: null, order: null, scans: [], thread: '', starting: false, camSession: 0, orderReq: 0, orderLoading: false, verdict: null, verifySeq: 0, idleFrames: 0, detectTok: 0, lastHit: 0 };
  var agree = ScanCore.createAgreement(CFG.requiredAgreement, CFG.agreeWindowMs);
  var rearm = ScanCore.createRearm(CFG.rearmGoneMs); // an item left in view is counted once

  // --- storage (localStorage can throw in private mode) ---
  function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  // --- decoder: native BarcodeDetector (Chrome/Android) or the ZXing-C++ WASM polyfill everywhere else ---
  var polyfillP = null;
  function ensureDetector() {
    if (S.detector) return Promise.resolve(S.detector);
    var ready = 'BarcodeDetector' in window ? Promise.resolve() : (polyfillP = polyfillP || new Promise(function (ok, fail) {
      var s = document.createElement('script'); s.src = CFG.polyfill; s.onload = ok; s.onerror = function () { fail(new Error('polyfill-failed')); };
      document.head.appendChild(s);
    }));
    return ready.then(function () {
      var BD = window.BarcodeDetector;
      return (BD.getSupportedFormats ? BD.getSupportedFormats() : Promise.resolve(CFG.formats)).catch(function () { return CFG.formats; });
    }).then(function (sup) {
      var use = CFG.formats.filter(function (f) { return sup.indexOf(f) !== -1; });
      try { S.detector = new BarcodeDetector({ formats: use.length ? use : CFG.formats }); } catch (e) { S.detector = new BarcodeDetector(); }
      return S.detector;
    });
  }

  // --- UI helpers ---
  var toastT;
  function toast(msg, err) { var t = $('toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(function () { t.className = ''; }, 3000); }
  function feedback(msg, cls) { $('feedback').textContent = msg || ''; $('feedback').className = cls || ''; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function safeHref(h) { return /^(https?:|mailto:|tel:|sms:)/i.test(h) ? h : '#'; }

  function setMode(cam) {
    $('tabCam').setAttribute('aria-selected', cam); $('tabUp').setAttribute('aria-selected', !cam);
    $('tabCam').tabIndex = cam ? 0 : -1; $('tabUp').tabIndex = cam ? -1 : 0;
    $('camMode').hidden = !cam; $('upMode').hidden = cam;
    if (!cam && (S.scanning || S.starting)) stopCamera();
  }
  function setToggle(btn, on) { btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', on); }

  // --- camera ---
  function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('Camera not available here (needs HTTPS). Upload an image or type the number.', true); return; }
    if (S.starting || S.scanning) return;
    var sid = ++S.camSession, CANCELLED = { cancelled: true };
    var live = function () { if (sid !== S.camSession) throw CANCELLED; };
    S.starting = true; $('startBtn').disabled = true; feedback('Starting camera…');
    // the AudioContext must be created inside the click (user gesture), before any await
    if (!S.audio) { try { S.audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    ensureDetector().then(function () {
      live();
      return navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: S.facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    }).then(function (stream) {
      if (sid !== S.camSession) { stream.getTracks().forEach(function (t) { t.stop(); }); throw CANCELLED; } // stopped while asking for permission
      S.stream = stream; S.track = stream.getVideoTracks()[0] || null;
    // camera unplugged, taken by another app or revoked: without this the page shows a frozen frame and scans nothing
    if (S.track) S.track.addEventListener('ended', function () { if (sid === S.camSession) { stopCamera(); toast('Camera bị ngắt, bấm bật lại camera', true); } });
      var v = $('video'); v.srcObject = stream; v.hidden = false;
      $('startBtn').hidden = true; $('controls').hidden = false; $('guide').hidden = false;
      setupTrackControls();
      return v.play();
    }).then(function () {
      live();
      S.starting = false; $('startBtn').disabled = false;
      S.scanning = true; S.paused = false; agree.reset(); rearm.reset();
      feedback('Point your camera at a barcode');
      requestAnimationFrame(loop);
    }).catch(function (err) {
      if (err === CANCELLED) return;
      var msg = err && err.name === 'NotAllowedError' ? 'Camera permission was denied.'
        : err && err.message === 'polyfill-failed' ? 'Could not load the barcode decoder.' : 'Could not start the camera.';
      toast(msg, true); stopCamera(); $('manual').focus();
    });
  }

  function stopCamera() {
    S.camSession++; S.starting = false; $('startBtn').disabled = false; // cancels a start still in progress
    S.scanning = false; S.paused = false; clearTimeout(S.pauseTimer);
    if (S.stream) S.stream.getTracks().forEach(function (t) { t.stop(); });
    S.stream = S.track = null; S.torch = false; setToggle($('torchBtn'), false);
    var v = $('video'); v.srcObject = null; v.hidden = true;
    $('startBtn').hidden = false; $('controls').hidden = true; $('guide').hidden = true; $('zoom').hidden = true;
    $('stage').classList.remove('locked'); drawBox(null); feedback('');
  }

  function flipCamera() { S.facing = S.facing === 'environment' ? 'user' : 'environment'; stopCamera(); setTimeout(startCamera, 200); }

  // Torch / zoom are only exposed by some devices (mostly Android Chrome).
  function setupTrackControls() {
    var caps = {}; try { caps = S.track.getCapabilities ? S.track.getCapabilities() : {}; } catch (e) {}
    $('torchBtn').hidden = !('torch' in caps);
    if (caps.focusMode && caps.focusMode.indexOf('continuous') !== -1) applyConstraint({ focusMode: 'continuous' }); // soft focus is the hardest case to fix in software
    var z = $('zoom');
    if (caps.zoom) { z.min = caps.zoom.min || 1; z.max = caps.zoom.max || 5; z.step = caps.zoom.step || 0.1; z.value = (S.track.getSettings().zoom) || z.min; z.hidden = false; }
    else z.hidden = true;
  }
  function applyConstraint(c) { if (S.track) S.track.applyConstraints({ advanced: [c] }).catch(function () {}); }

  // Throttled detect loop: one detect() in flight at a time, at most every detectIntervalMs.
  function loop() {
    if (!S.scanning || S.paused) return;
    var v = $('video'), now = Date.now();
    if (v.readyState < 2 || !v.videoWidth || now - S.lastDetect < CFG.detectIntervalMs) { requestAnimationFrame(loop); return; }
    S.lastDetect = now;
    // a detect() that never settles would stop the loop for good (seen with the WASM decoder): give up on it
    var hung = new Promise(function (ok, fail) { setTimeout(function () { fail(new Error('detect-timeout')); }, CFG.detectTimeoutMs); });
    Promise.race([detectFrame(v), hung]).then(function (codes) {
      if (!S.scanning || S.paused) return;
      // several codes in view (two items, or a box with EAN + QR): read the first one not counted yet, so the next
      // item can go in while the last one is still in frame
      var now = Date.now(), pick = codes.filter(function (c) { return rearm.allowed(c.rawValue, now); })[0] || codes[0];
      if (pick) onDetect(pick);
      else { drawBox(null); agree.expire(Date.now()); feedback(isDark(v) ? 'Too dark, add more light' : 'Point your camera at a barcode', isDark(v) ? 'warn' : ''); }
      var th = thumb(v); if (codes.length) S.ref = th;
      rearm.see(codes.map(function (c) { return c.rawValue; }), Date.now(), !codes.length && !sceneMoved(th, S.ref)); // after onDetect: it asks about the time before this frame
    }).catch(function () {}).then(function () { if (S.scanning && !S.paused) requestAnimationFrame(loop); });
  }

  // Retries for a frame the plain read misses, measured on the ZXing WASM decoder (Chrome on Windows): half size
  // averages out sensor noise in dim light, a hard contrast boost recovers a soft focus, and ±45° turns a diagonal
  // barcode back into one a 1D reader can scan. The one that last worked goes first, so a held item reads every frame.
  var VARIANTS = [{}, { scale: 0.5 }, { filter: 'grayscale(1) contrast(3)' }, { rot: Math.PI / 4 }, { rot: -Math.PI / 4 }];
  var fbC = document.createElement('canvas');
  function variantSource(v, x) {
    if (!x.scale && !x.filter && !x.rot) return v;
    var w = v.videoWidth, h = v.videoHeight, k = x.scale || 1;
    fbC.width = w * k; fbC.height = h * k; // also resets the context's transform and filter
    var c = fbC.getContext('2d'); c.filter = x.filter || 'none';
    if (x.rot) { c.translate(w / 2, h / 2); c.rotate(x.rot); c.drawImage(v, -w / 2, -h / 2); } else c.drawImage(v, 0, 0, w * k, h * k);
    return fbC;
  }
  function detectFrame(v) {
    var order = [S.variant || 0].concat(VARIANTS.map(function (x, i) { return i; }).filter(function (i) { return i !== (S.variant || 0); }));
    // Retries cost up to 4 extra decodes per frame: run them while a code was read in the last 2 s (an item is being
    // shown) and otherwise on every 3rd empty frame, so an idle camera on a stand does not keep the CPU busy.
    var hot = Date.now() - (S.lastHit || 0) < 2000;
    if (!hot && ++S.idleFrames % 3) order = [VARIANTS[S.variant || 0].rot ? 0 : S.variant || 0];
    var i = 0, tok = ++S.detectTok; // a chain left behind by the 3 s timeout stops instead of racing the new one
    function next() {
      if (i >= order.length || !S.scanning || tok !== S.detectTok) return Promise.resolve([]);
      var n = order[i++], x = VARIANTS[n];
      return S.detector.detect(variantSource(v, x)).then(function (codes) {
        if (!codes.length) return next();
        if (tok !== S.detectTok) return [];
        S.variant = n; S.lastHit = Date.now();
        return codes.map(function (c) { // boxes back in video pixels; a rotated read has no usable box
          var b = c.boundingBox, k = x.scale || 1;
          return { rawValue: c.rawValue, format: c.format, boundingBox: x.rot || !b ? null : { x: b.x / k, y: b.y / k, width: b.width / k, height: b.height / k } };
        });
      });
    }
    return next();
  }

  function onDetect(code) {
    var raw = code.rawValue, fmt = (code.format || '').toLowerCase(), v = $('video');
    drawBox(code.boundingBox);
    if (!ScanCore.isReadTrustworthy(raw, fmt)) { feedback('Reading, hold steady', 'warn'); return; }

        ['eBay', 'https://www.ebay.com/sch/i.html?_nkw=' + q], ['Walmart', 'https://www.walmart.com/search?q=' + q], ['Google', 'https://www.google.com/search?q=' + q],
      ].map(function (l) { return '<a class="btn" target="_blank" rel="nofollow noopener" href="' + esc(l[1]) + '">' + l[0] + '</a>'; }).join('') + '</div>';
    } else {
      var p = ScanCore.parseQr(e.value), keys = Object.keys(p.fields).filter(function (k) { return p.fields[k]; });
      if (keys.length) html += '<dl>' + keys.map(function (k) { return '<dt>' + esc(k) + '</dt><dd>' + esc(p.fields[k]) + '</dd>'; }).join('') + '</dl>';
      if (p.href) html += '<div class="row"><a class="btn primary" target="_blank" rel="nofollow noopener" href="' + esc(safeHref(p.href)) + '">Open</a></div>';
    }
    box.innerHTML = html; box.hidden = false;
    lookupProduct(e.value);
  }

  function renderHistory() {
    $('histEmpty').hidden = S.history.length > 0;
    $('hist').innerHTML = S.history.map(function (e, i) {
      return '<li><span class="tag">' + esc(NAMES[e.format] || e.format) + '</span><button type="button" class="v" data-show="' + i + '" title="' + esc(e.value) + '" aria-label="Show ' + esc(e.value) + '">' + esc(e.value) + '</button>' +
        '<button data-copy="' + esc(e.value) + '" aria-label="Copy">⧉</button><button data-del="' + i + '" aria-label="Delete">✕</button></li>';
    }).join('');
  }

  function copy(t) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('Copied'); }, function () { toast('Copy failed', true); }); }

  function exportCsv() {
    if (!S.history.length) return;
    // a cell starting with = + - @ (or tab/CR) runs as a formula in Excel: prefix it with ' so it stays text
    var q = function (s) { s = String(s); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
    var csv = 'value,format,source,scanned_at\n' + S.history.map(function (e) { return [q(e.value), q(NAMES[e.format] || e.format), q(e.source), q(new Date(e.ts).toISOString())].join(','); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'barcode-scans.csv'; a.click();
  }

  // --- wiring ---
  $('tabCam').onclick = function () { setMode(true); };
  $('tabUp').onclick = function () { setMode(false); };
  $('tabCam').parentNode.onkeydown = function (e) {
    if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].indexOf(e.key) === -1) return;
    e.preventDefault(); var cam = e.key === 'Home' ? true : e.key === 'End' ? false : $('camMode').hidden;
    setMode(cam); (cam ? $('tabCam') : $('tabUp')).focus();
  };
  $('startBtn').onclick = startCamera;
  $('stopBtn').onclick = stopCamera;
  $('flipBtn').onclick = flipCamera;
  $('torchBtn').onclick = function () { S.torch = !S.torch; setToggle(this, S.torch); applyConstraint({ torch: S.torch }); };
  $('zoom').oninput = function () { applyConstraint({ zoom: parseFloat(this.value) }); };
  $('video').onclick = function () { applyConstraint({ focusMode: 'single-shot' }); };
  $('beepBtn').onclick = function () { S.beep = !S.beep; this.textContent = S.beep ? '🔊' : '🔇'; setToggle(this, S.beep); save(CFG.settingsKey, { beep: S.beep }); };
  $('manualBtn').onclick = manual;
  $('manual').onkeydown = function (e) { if (e.key === 'Enter') manual(); };
  var drop = $('drop');
  drop.onclick = function () { $('file').click(); };
  drop.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } };
  $('file').onchange = function () { pickFile(this.files[0]); this.value = ''; };
  drop.ondragover = function (e) { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = function () { drop.classList.remove('over'); };
  drop.ondrop = function (e) { e.preventDefault(); drop.classList.remove('over'); pickFile(e.dataTransfer.files[0]); };
  document.addEventListener('paste', function (e) { var f = [].find.call(e.clipboardData.files || [], function (f) { return f.type.indexOf('image/') === 0; }); if (f) { setMode(false); pickFile(f); } });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-copy],[data-del],[data-show]'); if (!t) return;
    if (t.dataset.copy != null) copy(t.dataset.copy);
    else if (t.dataset.del != null) { S.history.splice(+t.dataset.del, 1); save(CFG.historyKey, S.history); renderHistory(); }
    else renderResult(S.history[+t.dataset.show]);
  });
  $('csvBtn').onclick = exportCsv;
  $('orderForm').onsubmit = function (e) { e.preventDefault(); var id = $('orderId').value.trim().toUpperCase(); if (id) loadOrder(id); };
  $('orderPrint').onclick = function () { window.print(); };
  $('orderReset').onclick = function () { S.scans = []; S.verdict = null; S.verifySeq++; renderOrder(); };
  $('chatForm').onsubmit = function (e) { e.preventDefault(); var t = $('chatInput').value.trim(); if (t) { askAI(t); $('chatInput').value = ''; } };
  $('copyAllBtn').onclick = function () { if (S.history.length) copy(S.history.map(function (e) { return e.value; }).join('\n')); };
  $('clearBtn').onclick = function () { if (S.history.length && confirm('Clear all scan history?')) { S.history = []; save(CFG.historyKey, []); renderHistory(); $('result').hidden = true; } };
  // Release the camera when the tab is hidden; Safari otherwise keeps the camera light on.
  document.addEventListener('visibilitychange', function () { if (document.hidden && (S.scanning || S.starting)) stopCamera(); });

  S.history = load(CFG.historyKey, []);
  var st = load(CFG.settingsKey, {});
  if (st.beep === false) { S.beep = false; $('beepBtn').textContent = '🔇'; setToggle($('beepBtn'), false); }
  renderHistory();
  ensureDetector().catch(function () {}); // warm up the WASM decoder so the first scan is fast
})();
</script>
</body>
</html>
