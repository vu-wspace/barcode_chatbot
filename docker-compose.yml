# FE scan -> gate (nginx) -> /api/ -> be -> db (products, orders)
#                         -> /ai/  -> ai (agent) -> tools call be's API -> db
#   docker compose up -d --build
# Open http://localhost:${GATE_PORT:-8080}

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: barcode_chatbot
    ports:
      - "127.0.0.1:5433:5432"  # local runs / DB tools: DATABASE_URL=...@localhost:5433/barcode_chatbot (localhost only)
    volumes:
      - pgdata:/var/lib/postgresql  # postgres 18 keeps its data under this directory
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "barcode_chatbot"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  be:
    build: src/barcode_chatbot/be
    environment:
      # a password with @ : / ? # % must be URL-encoded here
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/barcode_chatbot
      SEED_DEMO: ${SEED_DEMO:-true}  # demo products + orders SO-104587, SO-104588 (never overwrites edited rows)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ai:
    build: src/barcode_chatbot/agent
    env_file: .env  # OPENROUTER_API_KEY, GOOGLE_API_KEY, GROQ_API_KEY, LANGSMITH_*
    environment:
      BE_URL: http://be:8000
      # chat history (LangGraph checkpoints) lives in the same Postgres; overrides the localhost URL in .env
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/barcode_chatbot
    depends_on:
      db:
        condition: service_healthy
      be:
        condition: service_started
    restart: unless-stopped

  gate:
    build: src/barcode_chatbot/fe
    ports:
      # localhost only: no login yet, and /ai/ spends LLM credits. For LAN use, put auth in front first.
      - "127.0.0.1:${GATE_PORT:-8080}:80"
    environment:
      BE_URL: http://be:8000
      AI_URL: http://ai:8000
    depends_on:
      - be
      - ai
    restart: unless-stopped

volumes:
  pgdata:
